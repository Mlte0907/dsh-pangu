# dsh-pangu bundle patch: 盘古 MCP 接入 + 仪表盘宿主
- insert:
    # pangu-dashboard 排在前面:mcp-pangu 的地址/凭据由它在 apply() 里读
    # ~/.pangu/config.json 后经 entry.update 注入(lib/mcp-inject.js),
    # 先到者先把值备好;注入是普通 config 更新 → remount 热生效,
    # 设置页保存时还会再注一次(保存即生效,无需重启)。
    - id: pangu-dashboard
      name: dsh-pangu
    - id: mcp-pangu
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: pangu
        transport: streamable-http
        # ── MCP 地址与凭据:这里只是声明默认值,真实值由插件注入 ──────────
        # 禁止再用求值器读文件的写法:Loader 求值域是 with(fiberCtx)+eval、
        # 进程为 ESM,没有 require;旧写法的 catch 把 ReferenceError 静默吞掉,
        # 回退 127.0.0.1:19529 + 空 X-API-Key → MCP 恒 disconnected
        # (根因报告 dsh-pangu-mcp-disconnect-report.md,E1 已用真 evaluate 复跑证实)。
        # 值来源仍是设置页共用的 ~/.pangu/config.json(pangu_base_url / api_key),
        # 由 lib/mcp-inject.js 在激活与设置保存时注入;不回落 ~/.pangu/.mcp_key
        # 或 PANGU_API_KEY —— 否则会出现「设置页填的是本地、实际却拿云端令牌去连」
        # 的错配(表现为每个请求 401)。
        # failOnStartupError: true = 注入未发生时启动即失败(响亮暴露),
        # 而不是像旧 catch 那样静默连错地址;注入成功后会被改为 false。
        url: http://127.0.0.1:19529/mcp
        toolCallTimeoutMs: 60000
        headers:
          X-API-Key: ''
        failOnStartupError: true
        # ── 关于工具白名单 ──────────────────────────────────────────
        # 早期版本此处配置了 `tools.allow` 白名单（11 个工具）。
        # 但 `@deepseek-ai/dsh-mcp-client` 的 Config schema 并不包含
        # `tools` 键（streamable-http 分支仅接受 transport / serverName /
        # url / headers / toolCallTimeoutMs / failOnStartupError / reconnect），
        # schemastery 在非严格模式下会原样保留该未知键，客户端随后将其忽略。
        # 结果是该白名单**完全不生效**、且无任何告警。
        # 为避免"看似有保护、实际没有"的错误预期，这里已移除该配置。
        #
        # 工具范围的真正控制点在**服务端**：盘古有三级暴露机制
        # （core / optional / experimental，见 pangu/server/exposure.py），
        # 缺省即收敛为 28 个核心工具，其余工具不会出现在 tools/list 中。
        # 需要放开时改 ~/.pangu/config.json：
        #   { "exposure": { "enabled_optional_modules": ["multimodal"] } }

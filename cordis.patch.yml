# dsh-pangu bundle patch: 盘古 MCP 接入 + 仪表盘宿主
- insert:
    - id: mcp-pangu
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: pangu
        transport: streamable-http
        # ── MCP 地址与凭据:这里只是引导默认值,真实值由插件注入 ──────────
        # 注入经 ctx.loader.entries() 递归查找本行(bundle patch 行挂在 Include
        # 子树,本层 store/resolve 查不到 —— 0.6.0/0.6.1 曾因此 miss);
        # 行序保持 mcp 在前仅为可读性,查找与行序无关。
        # 禁止再用求值器读文件:Loader 求值域是 with(fiberCtx)+eval、进程 ESM,
        # 没有 require;旧写法 catch 静默回退 127.0.0.1:19529 + 空 X-API-Key
        # → MCP 恒 disconnected(根因报告 dsh-pangu-mcp-disconnect-report.md,
        # E1 已用真 evaluate 复跑证实)。
        # 值来源 = 设置页共用的 ~/.pangu/config.json(pangu_base_url/api_key),
        # 由 lib/mcp-inject.js 在激活、保存后注入(普通 config 变更 → remount
        # 热生效);配置坏时注入 fail-loud 形态(failOnStartupError=true)响亮
        # 失败,而不是静默连错地址;不回落 ~/.pangu/.mcp_key / PANGU_API_KEY
        # —— 否则会「设置页填本地、实际拿云端令牌连」错配(每请求 401)。
        # 静态 failOnStartupError=false:默认值仅是引导占位,首连失败交给注入后
        # 的 remount;坏配置的响亮失败由注入以 true 负责。
        url: http://127.0.0.1:19529/mcp
        toolCallTimeoutMs: 60000
        headers:
          X-API-Key: ''
        failOnStartupError: false
        # ── 关于工具白名单 ──────────────────────────────────────────
        # 早期版本此处配置了 `tools.allow` 白名单（11 个工具）。
        # 但 `@deepseek-ai/dsh-mcp-client` 的 Config schema 并不包含
        # `tools` 键（streamable-http 分支仅接受 transport / serverName /
        # url / headers / toolCallTimeoutMs / failOnStartupError / reconnect），
        # schemastery 在非严格模式下会原样保留该未知键，客户端随后将其忽略。
        # 结果是该白名单**完全不生效**、且无任何告警。
        # 为避免"看似有保护、实际没有"的错误预期，这里已移除该配置。
        #
        # 工具范围的真正控制点在**服务端**：盘古有三级暴露机制
        # （core / optional / experimental，见 pangu/server/exposure.py），
        # 缺省即收敛为 28 个核心工具，其余工具不会出现在 tools/list 中。
        # 需要放开时改 ~/.pangu/config.json：
        #   { "exposure": { "enabled_optional_modules": ["multimodal"] } }
    - id: pangu-dashboard
      name: dsh-pangu
